<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abhijit Somala - CRT boot</title>
<meta name="description" content="Abhijit Somala. ML engineer. Terminal portfolio.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #020905;
    --g: #41ff7a;
    --g-hi: #c9ffdb;
    --g-dim: #2dbd60;
    --g-mut: #1d8a46;
    --border: #14532d;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --fs: 15px;
  }
  @media (max-width: 430px) { :root { --fs: 13.5px; } }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--g);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--g); color: #02140a; }
  :focus-visible { outline: 2px solid var(--g); outline-offset: 2px; }

  /* ---------- stage: the whole terminal ---------- */
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  #stage.poweron { animation: crtOn 0.5s cubic-bezier(0.23, 1, 0.32, 1) both; }
  @keyframes crtOn {
    0%   { transform: scale(1, 0.012); filter: brightness(4); opacity: 0.4; }
    55%  { transform: scale(1, 1);     filter: brightness(1.6); opacity: 1; }
    100% { transform: none;            filter: brightness(1); opacity: 1; }
  }

  #tbar {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px clamp(14px, 4vw, 24px);
    padding-right: 158px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--g-dim);
    white-space: nowrap;
  }
  @media (max-width: 560px) { #tbar-right { display: none; } }

  #scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px clamp(14px, 4vw, 24px) 10px;
    font-size: var(--fs);
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #scroll::-webkit-scrollbar { width: 10px; }
  #scroll::-webkit-scrollbar-thumb { background: var(--border); }
  #scroll::-webkit-scrollbar-track { background: transparent; }

  .line {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.6;
    min-height: 1.6em;
    text-shadow: 0 0 6px rgba(65, 255, 122, 0.25);
  }
  .dim { color: var(--g-dim); }
  .mut { color: var(--g-mut); text-shadow: none; }
  .hi  { color: var(--g-hi); text-shadow: 0 0 8px rgba(130, 255, 175, 0.4); }
  .head { color: var(--g-hi); letter-spacing: 0.1em; text-shadow: 0 0 8px rgba(130, 255, 175, 0.4); }
  .banner {
    font-family: 'VT323', var(--mono);
    font-size: clamp(36px, 9vw, 60px);
    line-height: 1.05;
    color: var(--g-hi);
    text-shadow: 0 0 16px rgba(95, 255, 155, 0.55), 0 0 3px rgba(201, 255, 219, 0.6);
    padding: 10px 0 2px;
  }

  .cmd {
    color: var(--g-hi);
    background: rgba(65, 255, 122, 0.09);
    border: 1px solid var(--border);
    padding: 1px 7px;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .cmd:hover, .cmd:focus-visible {
    background: var(--g);
    color: #02140a;
    border-color: var(--g);
    text-shadow: none;
  }
  #scroll a {
    color: var(--g-hi);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  #scroll a:hover { background: var(--g); color: #02140a; text-shadow: none; }

  /* ---------- prompt row ---------- */
  #prow {
    flex: 0 0 auto;
    display: none;
    position: relative;
    align-items: baseline;
    flex-wrap: wrap;
    border-top: 1px solid var(--border);
    padding: 12px clamp(14px, 4vw, 24px);
    font-size: var(--fs);
    cursor: text;
  }
  body.ready #prow { display: flex; }
  #ps1 { color: var(--g-dim); white-space: pre; }
  #mirror { color: var(--g-hi); white-space: pre-wrap; overflow-wrap: anywhere; text-shadow: 0 0 8px rgba(130, 255, 175, 0.4); }
  #caret {
    width: 0.6em;
    height: 1.15em;
    margin-left: 1px;
    background: var(--g);
    box-shadow: 0 0 8px rgba(65, 255, 122, 0.8);
    display: inline-block;
    vertical-align: text-bottom;
    animation: caretblink 1.12s steps(1, end) infinite;
  }
  body.typing #caret { animation: none; opacity: 1; }
  @keyframes caretblink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0.15; } }
  #cmd {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    border: none;
    background: transparent;
    color: transparent;
    font: inherit;
    font-size: 16px;
    caret-color: transparent;
    cursor: text;
  }
  #cmd:focus { outline: none; }

  /* ---------- CRT overlay layers ---------- */
  #scan {
    position: fixed;
    inset: 0;
    z-index: 70;
    pointer-events: none;
    background:
      repeating-linear-gradient(0deg,
        rgba(0, 0, 0, 0.3) 0px, rgba(0, 0, 0, 0.3) 1px,
        rgba(0, 0, 0, 0) 1px, rgba(0, 0, 0, 0) 3px),
      radial-gradient(ellipse at 50% 45%,
        rgba(0, 0, 0, 0) 55%, rgba(0, 8, 3, 0.55) 100%);
  }
  #flick {
    position: fixed;
    inset: 0;
    z-index: 71;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 38%, rgba(120, 255, 170, 0.07), rgba(0, 0, 0, 0) 62%);
    opacity: 0.5;
    animation: flickA 6.4s steps(1, end) infinite;
  }
  @keyframes flickA {
    0%   { opacity: 0.45; }
    9%   { opacity: 0.62; }
    11%  { opacity: 0.42; }
    23%  { opacity: 0.55; }
    31%  { opacity: 0.4;  }
    47%  { opacity: 0.6;  }
    52%  { opacity: 0.44; }
    68%  { opacity: 0.58; }
    77%  { opacity: 0.42; }
    88%  { opacity: 0.56; }
    100% { opacity: 0.45; }
  }
  /* activity-reactive: stronger flicker plus a tiny jitter while text is printing */
  body.crt-hot #flick { animation: flickB 0.17s steps(2, end) infinite; }
  @keyframes flickB { 0% { opacity: 0.8; } 50% { opacity: 0.35; } 100% { opacity: 0.75; } }
  body.crt-hot #scroll { animation: jit 0.15s steps(2, end) infinite; }
  @keyframes jit {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(0.5px, -0.5px); }
    50%  { transform: translate(-0.5px, 0.4px); }
    75%  { transform: translate(0.4px, 0.5px); }
    100% { transform: translate(0, 0); }
  }

  /* ---------- chrome ---------- */
  #backlink {
    position: fixed;
    top: 8px;
    right: 10px;
    z-index: 60;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--g-dim);
    border: 1px solid var(--border);
    background: rgba(1, 10, 5, 0.9);
    padding: 5px 9px;
  }
  #backlink:hover { color: var(--g-hi); border-color: var(--g-dim); }

  #skiphint {
    position: fixed;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    z-index: 60;
    color: var(--g-mut);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    white-space: nowrap;
    display: none;
  }
  body.booting #skiphint { display: block; }

  noscript .line { padding: 16px clamp(14px, 4vw, 24px); display: block; }
  noscript a { color: var(--g-hi); }

  /* ---------- reduced motion: no flicker, no jitter, no blink, static scanlines stay ---------- */
  @media (prefers-reduced-motion: reduce) {
    #flick { display: none; }
    #caret { animation: none; opacity: 1; }
    #stage { animation: none !important; filter: none !important; }
    body.crt-hot #scroll { animation: none; }
    .cmd, #scroll a, #backlink { transition: none; }
  }
</style>

<script>
(function () {
  'use strict';

  var RM = false;
  try { RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  var stage    = document.getElementById('stage');
  var scroller = document.getElementById('scroll');
  var prow     = document.getElementById('prow');
  var input    = document.getElementById('cmd');
  var mirror   = document.getElementById('mirror');
  var clockEl  = document.getElementById('clock');

  var PS1 = 'abhi@somala-os:~$ ';
  var KEY = 'crt09Booted';
  var ready = false;

  /* ---------- content ---------- */

  function T(t, cls) { return { segs: [{ t: t, cls: cls }] }; }
  var B = { segs: [{ t: '' }] };

  var WELCOME = [

    { cls: 'banner', segs: [{ t: 'ABHIJIT SOMALA' }] },
    T('ML engineer. Builds things that ship.', 'hi'),

    { segs: [

      { t: 'experience', cmd: 'experience' }, { t: '  ' },
      { t: 'projects', cmd: 'projects' }, { t: '  ' },
      { t: 'contact', cmd: 'contact' }, { t: '  ' },
      { t: 'help', cmd: 'help' }
    ] },
    B
  ];

  var COMMANDS = {
    help: [
      T('AVAILABLE COMMANDS', 'head'),
      { segs: [{ t: '  ' }, { t: 'about', cmd: 'about' },           { t: '         who I am', cls: 'dim' }] },
      { segs: [{ t: '  ' }, { t: 'experience', cmd: 'experience' }, { t: '    Focara, Virginia Tech NLP Lab, Nomic AI', cls: 'dim' }] },
      { segs: [{ t: '  ' }, { t: 'projects', cmd: 'projects' },     { t: '      OpenSight plus the algae bloom model', cls: 'dim' }] },
      { segs: [{ t: '  ' }, { t: 'contact', cmd: 'contact' },       { t: '       email, GitHub, LinkedIn', cls: 'dim' }] },
      { segs: [{ t: '  ' }, { t: 'clear', cmd: 'clear' },           { t: '         wipe the scrollback', cls: 'dim' }] },
      T('type a command and press enter, or click one.', 'mut'),
      B
    ],
    about: [
      T('ABOUT', 'head'),
      B,
      T('Abhijit Somala. Abhi. ML engineer at Cornell University, based between Ithaca, NY and Richmond, VA.'),
      B,
      T("I've worked across the ML stack, from unsupervised clustering on data with no labels to inference pipelines running in production for tens of thousands of users. Right now I'm building at Focara, an EdTech startup, and leading applied ML work at Virginia Tech's NLP Research Lab. Before that I built embedding visualization infrastructure at Nomic AI. My biggest project so far is OpenSight, a real-time multi-agent voice assistant for blind and low-vision users. It placed top 10 out of 2,500+ teams nationally."),
      B
    ],
    experience: [
      T('EXPERIENCE (3)', 'head'),
      B,
      T('[01] Focara :: ML Engineer :: stealth EdTech startup :: May 2026 to present', 'hi'),
      T('     Built a Canvas webhook plus LLM classifier that surfaces critical announcements before academic deadlines.'),
      T('     Cut pipeline latency from 900ms to 500ms. Architected the multi-tenant chat-to-migration system.'),
      B,

      T('     Led a 10-person team rebuilding a recommendation pipeline with no baseline to start from. Got a 40%+ MAP improvement.'),
      T('     Shipped clustering, sentiment, and LLM inference pipelines to production, serving 45k users.'),
      B,
      T('[03] Nomic AI :: AI Data Engineering Intern :: Summer 2024', 'hi'),
      T('     Built embedding visualization and ETL infrastructure for 250k+ monthly users.'),
      B
    ],
    projects: [
      T('PROJECTS (2)', 'head'),
      B,
      T('[01] OPENSIGHT :: FLAGSHIP', 'hi'),
      T("     A real-time multi-agent voice assistant that replaces screen readers with active task execution for blind and low-vision users. I built it because screen readers describe a page, they don't act on it."),
      { segs: [{ t: '     result   ', cls: 'dim' }, { t: 'top 10 finalist in North America out of 2,500+ teams, Google Developer Groups Solution Challenge 2026' }] },
      { segs: [{ t: '     speed    ', cls: 'dim' }, { t: 'a multi-step web task runs in under 60 seconds. screen reader baseline is 5 to 10 minutes' }] },
      { segs: [{ t: '     stack    ', cls: 'dim' }, { t: 'FastAPI, WebSockets, Gemini on Vertex AI, Deepgram STT, Google Cloud TTS' }] },
      { segs: [{ t: '     tested   ', cls: 'dim' }, { t: 'validated with the Blind Institute of Technology and the Virginia Department for the Blind and Vision Impaired' }] },
      { segs: [{ t: '     source   ', cls: 'dim' }, { t: 'github.com/abhisomala/OpenSight_GDGChallenge_2026', href: 'https://github.com/abhisomala/OpenSight_GDGChallenge_2026' }] },
      B,
      T('[02] ALGAE BLOOM PREDICTION MODEL', 'hi'),
      T('     Autonomous detection across 50k+ satellite images. 92% detection accuracy. Deployed to AWS Lambda for real-time monitoring.'),
      B
    ],
    contact: [
      T('CONTACT', 'head'),
      B,
      { segs: [{ t: '  email     ', cls: 'dim' }, { t: 'somala.abhi@gmail.com', href: 'mailto:somala.abhi@gmail.com' }] },
      { segs: [{ t: '  github    ', cls: 'dim' }, { t: 'github.com/abhisomala', href: 'https://github.com/abhisomala' }] },
      { segs: [{ t: '  linkedin  ', cls: 'dim' }, { t: 'linkedin.com/in/abhijitsomala', href: 'https://www.linkedin.com/in/abhijitsomala' }] },
      B
    ],
    whoami: [
      T('ML engineer. Builds things that ship.', 'hi'),
      B
    ]
  };

  var CLEARED = [
    { segs: [{ t: 'scrollback cleared. type ', cls: 'dim' }, { t: 'help', cmd: 'help' }, { t: ' for commands.', cls: 'dim' }] },
    B
  ];

  var BOOT = [
    { line: T('SOMALA SYSTEMS PHOSPHOR BIOS V2.6', 'hi'), d: 200 },
    { line: T('(C) 2026 ABHIJIT SOMALA. GREEN P1 PHOSPHOR.', 'dim'), d: 170 },
    { line: B, d: 110 },
    { line: T('MEMORY TEST: 65536 KB OK'), d: 150 },
    { line: T('CPU: ML ENGINEER @ CORNELL UNIVERSITY'), d: 150 },
    { line: T('BASE: ITHACA, NY / RICHMOND, VA'), d: 150 },
    { line: B, d: 110 },
    { line: T('LOADING EXPERIENCE... [FOCARA, VT NLP LAB, NOMIC AI]'), d: 190 },
    { bar: { label: 'MOUNTING PROJECT: OPENSIGHT' } },
    { line: T('MOUNTING PROJECT: ALGAE-BLOOM-MODEL ... OK'), d: 160 },
    { line: T('CONTACT MODULE READY [EMAIL, GITHUB, LINKEDIN]'), d: 180 },
    { line: B, d: 110 },
    { line: T('BOOT COMPLETE.', 'hi'), d: 240 },
    { line: { cls: 'hi', segs: [{ t: "TYPE '" }, { t: 'help', cmd: 'help' }, { t: "' OR SELECT A COMMAND." }] }, d: 180 }
  ];

  /* ---------- printing engine ---------- */

  function scrollBottom() { scroller.scrollTop = scroller.scrollHeight; }

  var hotT = null;
  function pulse() {
    if (RM) return;
    document.body.classList.add('crt-hot');
    clearTimeout(hotT);
    hotT = setTimeout(function () { document.body.classList.remove('crt-hot'); }, 240);
  }

  function norm(L) {
    if (typeof L === 'string') return { cls: '', segs: [{ t: L }] };
    return { cls: L.cls || '', segs: L.segs || [{ t: '' }] };
  }

  function buildSeg(sg) {
    var n;
    if (sg.cmd) {
      n = document.createElement('span');
      n.className = 'cmd';
      n.dataset.cmd = sg.cmd;
      n.setAttribute('role', 'button');
      n.tabIndex = 0;
    } else if (sg.href) {
      n = document.createElement('a');
      n.href = sg.href;
      if (sg.href.slice(0, 7) !== 'mailto:') { n.target = '_blank'; n.rel = 'noopener'; }
    } else {
      n = document.createElement('span');
      if (sg.cls) n.className = sg.cls;
    }
    return n;
  }

  function renderInstant(lines) {
    var frag = document.createDocumentFragment();
    lines.forEach(function (L) {
      var ln = norm(L);
      var d = document.createElement('div');
      d.className = 'line' + (ln.cls ? ' ' + ln.cls : '');
      ln.segs.forEach(function (sg) {
        var n = buildSeg(sg);
        n.textContent = sg.t || '';
        d.appendChild(n);
      });
      frag.appendChild(d);
    });
    scroller.appendChild(frag);
    scrollBottom();
    window.__lastTypeMs = 0;
  }

  function typeLines(lines) {
    if (RM) { renderInstant(lines); return Promise.resolve(); }
    var t0 = performance.now();
    var norms = lines.map(norm);
    var total = 0;
    norms.forEach(function (l) { l.segs.forEach(function (s) { total += (s.t || '').length; }); });
    var cps = Math.max(480, Math.ceil(total / 1.1));
    return new Promise(function (resolve) {
      var li = 0, si = 0, ci = 0, lineEl = null, segEl = null, budget = 0, last = performance.now();
      function ensure() {
        while (li < norms.length) {
          if (!lineEl) {
            lineEl = document.createElement('div');
            lineEl.className = 'line' + (norms[li].cls ? ' ' + norms[li].cls : '');
            scroller.appendChild(lineEl);
            si = 0; ci = 0; segEl = null;
          }
          var segs = norms[li].segs;
          if (si >= segs.length) { li++; lineEl = null; continue; }
          var sg = segs[si];
          if (!segEl) { segEl = buildSeg(sg); segEl.textContent = ''; lineEl.appendChild(segEl); ci = 0; }
          var txt = sg.t || '';
          if (ci >= txt.length) { si++; segEl = null; continue; }
          return txt;
        }
        return null;
      }
      function frame(now) {
        budget += (now - last) / 1000 * cps;
        last = now;
        var n = Math.floor(budget);
        budget -= n;
        var printed = false;
        while (n > 0) {
          var txt = ensure();
          if (txt === null) break;
          ci++;
          segEl.textContent = txt.slice(0, ci);
          n--;
          printed = true;
        }
        var done = ensure() === null;
        if (printed) { pulse(); scrollBottom(); }
        if (done) {
          window.__lastTypeMs = performance.now() - t0;
          scrollBottom();
          resolve();
        } else {
          requestAnimationFrame(frame);
        }
      }
      requestAnimationFrame(frame);
    });
  }

  var chain = Promise.resolve();
  function enqueue(fn) {
    chain = chain.then(fn)['catch'](function (e) {
      if (window.console && console.warn) console.warn('crt queue: ' + e);
    });
  }

  /* ---------- commands ---------- */

  function echo(cmdtext) {
    renderInstant([{ segs: [{ t: PS1, cls: 'dim' }, { t: cmdtext, cls: 'hi' }] }]);
  }

  function runCommand(raw) {
    if (!ready) return;
    var t = String(raw || '').trim();
    enqueue(function () { echo(t); });
    if (!t) return;
    var key = t.split(/\s+/)[0].toLowerCase();
    if (key === 'clear') {
      enqueue(function () {
        scroller.textContent = '';
        renderInstant(CLEARED);
      });
      return;
    }
    var def = COMMANDS[key];
    if (def) {
      enqueue(function () { return typeLines(def); });
    } else {
      var shown = key.slice(0, 40);
      enqueue(function () {
        return typeLines([
          { segs: [{ t: 'sh: ' + shown + ': command not found. type ', cls: 'dim' }, { t: 'help', cmd: 'help' }, { t: '.', cls: 'dim' }] },
          B
        ]);
      });
    }
  }

  /* ---------- input wiring ---------- */

  var typT = null;
  function sync() {
    mirror.textContent = input.value;
    document.body.classList.add('typing');
    clearTimeout(typT);
    typT = setTimeout(function () { document.body.classList.remove('typing'); }, 420);
  }
  function focusInput() {
    try { input.focus({ preventScroll: true }); } catch (e) { try { input.focus(); } catch (e2) {} }
  }
  function submitVal() {
    var v = input.value;
    input.value = '';
    sync();
    runCommand(v);
  }

  input.addEventListener('input', sync);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); submitVal(); }
  });
  prow.addEventListener('submit', function (e) { e.preventDefault(); submitVal(); });
  prow.addEventListener('click', focusInput);

  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('.cmd') : null;
    if (el && ready) runCommand(el.dataset.cmd);
  });

  document.addEventListener('keydown', function (e) {
    if (!ready) return;
    var tEl = e.target;
    if (tEl && tEl.classList && tEl.classList.contains('cmd') && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      runCommand(tEl.dataset.cmd);
      return;
    }
    if (tEl === input) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Enter') {
      e.preventDefault();
      submitVal();
    } else if (e.key === 'Backspace') {
      e.preventDefault();
      input.value = input.value.slice(0, -1);
      sync();
      focusInput();
    } else if (e.key.length === 1) {
      e.preventDefault();
      input.value += e.key;
      sync();
      focusInput();
    }
  });

  /* ---------- clock ---------- */

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function tickClock() {
    var d = new Date();
    clockEl.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }
  tickClock();
  setInterval(tickClock, 1000);

  /* ---------- boot sequence, once per session ---------- */

  var booting = false, bootSkipped = false, bootEnded = false;
  var bootWaiters = [];

  function bwait(ms) {
    if (bootSkipped) return Promise.resolve();
    return new Promise(function (r) {
      var w = { r: r, t: 0 };
      w.t = setTimeout(function () {
        var i = bootWaiters.indexOf(w);
        if (i >= 0) bootWaiters.splice(i, 1);
        r();
      }, ms);
      bootWaiters.push(w);
    });
  }

  function skipBoot() {
    if (!booting || bootSkipped) return;
    bootSkipped = true;
    var ws = bootWaiters.slice();
    bootWaiters = [];
    ws.forEach(function (w) { clearTimeout(w.t); w.r(); });
  }

  function onSkipKey() { skipBoot(); }
  function onSkipPtr() { skipBoot(); }

  function bootBar(spec) {
    var d = document.createElement('div');
    d.className = 'line';
    var sp = document.createElement('span');
    d.appendChild(sp);
    scroller.appendChild(d);
    var segsN = 12;
    function draw(n) {
      var f = '';
      for (var j = 0; j < segsN; j++) f += (j < n ? '#' : '.');
      sp.textContent = spec.label + ' [' + f + '] ' + (n >= segsN ? 'OK' : Math.round(n / segsN * 100) + '%');
    }
    return new Promise(function (r) {
      if (bootSkipped || RM) { draw(segsN); scrollBottom(); return r(); }
      draw(0);
      scrollBottom();
      var i = 0;
      var t = setInterval(function () {
        if (bootSkipped) { clearInterval(t); draw(segsN); scrollBottom(); return r(); }
        i++;
        draw(i);
        pulse();
        scrollBottom();
        if (i >= segsN) { clearInterval(t); r(); }
      }, 38);
    });
  }

  function stepAt(i) {
    if (i >= BOOT.length) { endBoot(); return; }
    var st = BOOT[i];
    if (st.bar) {
      bootBar(st.bar).then(function () { stepAt(i + 1); });
      return;
    }
    renderInstant([st.line]);
    pulse();
    if (bootSkipped || RM) {
      stepAt(i + 1);
    } else {
      bwait(st.d || 150).then(function () { stepAt(i + 1); });
    }
  }

  function setReady() {
    if (ready) return;
    ready = true;
    window.__bootDone = performance.now();
    document.body.classList.add('ready');
    scrollBottom();
    focusInput();
  }

  function endBoot() {
    if (bootEnded) return;
    bootEnded = true;
    booting = false;
    document.removeEventListener('keydown', onSkipKey, true);
    document.removeEventListener('pointerdown', onSkipPtr, true);
    document.body.classList.remove('booting');
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
    if (bootSkipped || RM) {
      renderInstant(WELCOME);
      setReady();
    } else {
      typeLines(WELCOME).then(setReady);
    }
  }

  var seen = false;
  try { seen = sessionStorage.getItem(KEY) === '1'; } catch (e) {}

  if (seen) {
    renderInstant([T('SOMALA-OS V2.6 · SESSION RESTORED. BOOT SKIPPED.', 'dim')].concat(WELCOME));
    setReady();
  } else {
    window.__bootStart = performance.now();
    booting = true;
    document.body.classList.add('booting');
    if (!RM) stage.classList.add('poweron');
    document.addEventListener('keydown', onSkipKey, true);
    document.addEventListener('pointerdown', onSkipPtr, true);
    stepAt(0);
  }
})();
</script>
</body>
</html>
