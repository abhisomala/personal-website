<style>
  :root{
    --bg:      #060907;
    --panel:   #0a100c;
    --chrome:  #0d1510;
    --border:  #234032;
    --green:   #4ade80;
    --bright:  #d8f3e1;
    --dim:     #7fae92;
    --err:     #f87171;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--dim);
    font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:15px;
    line-height:1.65;
  }
  ::selection{ background:var(--green); color:#04120a; }

  #app{ height:100vh; height:100dvh; display:flex; flex-direction:column; }

  .t-green { color:var(--green); }
  .t-bright{ color:var(--bright); }
  .t-dim   { color:var(--dim); }
  .t-err   { color:var(--err); }
  .glow    { text-shadow:0 0 8px rgba(74,222,128,.35); }

  /* ---- the one mechanic: typing + blinking cursor + line-printing ---- */
  .cursor{
    display:inline-block;
    width:.6em; height:1.15em;
    background:var(--green);
    vertical-align:text-bottom;
    margin-left:2px;
    animation:blink 1.06s steps(1) infinite;
  }
  @keyframes blink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }
  .ln.pending{ display:none; }

  /* focus visibility */
  a:focus-visible, button:focus-visible{
    outline:2px solid var(--green);
    outline-offset:2px;
    border-radius:2px;
  }
  #prompt-line:focus-within{
    outline:2px solid var(--green);
    outline-offset:-2px;
  }

  .cmd-btn{
    cursor:pointer;
    border:1px solid var(--border);
    color:var(--green);
    background:transparent;
    padding:.2rem .65rem;
    font:inherit;
    font-size:.85rem;
    transition:background-color .18s ease-out, color .18s ease-out;
  }
  .cmd-btn:hover{ background:rgba(74,222,128,.12); color:var(--bright); }

  a.t-link{
    color:var(--green);
    text-decoration:underline;
    text-underline-offset:3px;
    transition:color .18s ease-out;
  }
  a.t-link:hover{ color:var(--bright); }

  #cmd-input{
    position:absolute;
    width:1px; height:1px;
    opacity:0;
    border:0; padding:0;
    font-size:16px; /* prevents iOS focus zoom */
    background:transparent; color:transparent;
    caret-color:transparent;
  }

  .banner{
    font-size:clamp(9px, 2.9vw, 16px);
    line-height:1.25;
    overflow-x:auto;
    white-space:pre;
    margin:0;
  }
  #out{ overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; }
  #out p, #out div{ overflow-wrap:break-word; }

  .dot{ width:11px; height:11px; border-radius:9999px; display:inline-block; }

  @media (prefers-reduced-motion: reduce){
    .cursor{ animation:none; }
    .ln.pending{ display:block; }
    *{ transition-duration:.01ms !important; }
  }
</style>

<script>
(function(){
  'use strict';
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var out    = document.getElementById('out');
  var input  = document.getElementById('cmd-input');
  var mirror = document.getElementById('cmd-mirror');
  var prompt = document.getElementById('prompt-line');
  if (!out || !input || !mirror || !prompt) return;

  var busy = false;
  var history = [];
  var histIdx = 0;

  var SECTIONS = { help:1, about:1, projects:1, contact:1, home:1 };
  var ALIASES  = { whoami:'home', intro:'home', ls:'projects', work:'projects', '?':'help', email:'contact', mail:'contact' };

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function scrollBottom(){ out.scrollTop = out.scrollHeight; }

  function echoCommand(raw){
    var line = document.createElement('div');
    line.className = 'mb-1';
    var p = document.createElement('span');
    p.className = 't-green';
    p.textContent = 'abhi@somala:~$ ';
    var c = document.createElement('span');
    c.className = 't-bright';
    c.textContent = raw;
    line.appendChild(p);
    line.appendChild(c);
    out.appendChild(line);
    scrollBottom();
  }

  function printError(cmd){
    var line = document.createElement('div');
    line.className = 'mb-4';
    var e = document.createElement('span');
    e.className = 't-err';
    e.textContent = 'zsh: command not found: ' + cmd;
    var hint = document.createElement('span');
    hint.className = 't-dim';
    hint.textContent = "  (try 'help')";
    line.appendChild(e);
    line.appendChild(hint);
    out.appendChild(line);
    scrollBottom();
  }

  /* the mechanic, part 2: content prints into the shell line by line */
  function printTemplate(id, lineDelay){
    var tpl = document.getElementById(id);
    if (!tpl || !tpl.content) return Promise.resolve();
    var wrap = document.createElement('div');
    wrap.appendChild(tpl.content.cloneNode(true));
    var lines = wrap.querySelectorAll('.ln');
    if (!REDUCED) {
      for (var i = 0; i < lines.length; i++) lines[i].classList.add('pending');
    }
    out.appendChild(wrap);
    scrollBottom();
    if (REDUCED || lines.length === 0) return Promise.resolve();
    var delay = lineDelay || 40;
    return (function reveal(i){
      if (i >= lines.length) return Promise.resolve();
      lines[i].classList.remove('pending');
      scrollBottom();
      return sleep(delay).then(function(){ return reveal(i + 1); });
    })(0);
  }

  function run(raw){
    var cmd = String(raw || '').trim().toLowerCase();
    if (!cmd) return Promise.resolve();
    history.push(raw.trim());
    histIdx = history.length;
    echoCommand(raw.trim());
    if (cmd === 'clear' || cmd === 'cls') {
      out.innerHTML = '';
      return Promise.resolve();
    }
    var key = ALIASES[cmd] || cmd;
    if (SECTIONS[key]) return printTemplate('tpl-' + key);
    printError(cmd);
    return Promise.resolve();
  }

  /* the mechanic, part 1: commands get typed character by character */
  function typeAndRun(cmd){
    if (busy) return Promise.resolve();
    busy = true;
    input.value = '';
    mirror.textContent = '';
    var chain = Promise.resolve();
    if (!REDUCED) {
      cmd.split('').forEach(function(ch){
        chain = chain.then(function(){
          mirror.textContent += ch;
          return sleep(30 + Math.random() * 45);
        });
      });
      chain = chain.then(function(){ return sleep(160); });
    }
    return chain.then(function(){
      mirror.textContent = '';
      return run(cmd);
    }).then(function(){ busy = false; }, function(){ busy = false; });
  }

  /* real keyboard input */
  input.addEventListener('input', function(){
    if (!busy) mirror.textContent = input.value;
  });

  input.addEventListener('keydown', function(e){
    if (busy) { if (e.key === 'Enter') e.preventDefault(); return; }
    if (e.key === 'Enter') {
      e.preventDefault();
      var v = input.value;
      input.value = '';
      mirror.textContent = '';
      if (v.trim()) {
        busy = true;
        run(v).then(function(){ busy = false; }, function(){ busy = false; });
      }
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (history.length && histIdx > 0) {
        histIdx--;
        input.value = history[histIdx];
        mirror.textContent = input.value;
      }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (histIdx < history.length - 1) {
        histIdx++;
        input.value = history[histIdx];
      } else {
        histIdx = history.length;
        input.value = '';
      }
      mirror.textContent = input.value;
    }
  });

  /* clickable command suggestions */
  var btns = document.querySelectorAll('[data-cmd]');
  for (var i = 0; i < btns.length; i++) {
    (function(btn){
      btn.addEventListener('click', function(){
        typeAndRun(btn.getAttribute('data-cmd') || '');
      });
    })(btns[i]);
  }

  /* clicking the prompt focuses the (visually hidden) input */
  prompt.addEventListener('click', function(){
    input.focus({ preventScroll: true });
  });

  /* boot sequence -> auto-typed whoami -> hero */
  function boot(){
    busy = true;
    printTemplate('tpl-boot', 130)
      .then(function(){ return sleep(REDUCED ? 0 : 250); })
      .then(function(){
        if (REDUCED) return;
        var chain = Promise.resolve();
        'whoami'.split('').forEach(function(ch){
          chain = chain.then(function(){
            mirror.textContent += ch;
            return sleep(30 + Math.random() * 45);
          });
        });
        return chain.then(function(){ return sleep(180); });
      })
      .then(function(){
        mirror.textContent = '';
        echoCommand('whoami');
        return printTemplate('tpl-home');
      })
      .then(function(){
        busy = false;
        if (window.matchMedia && window.matchMedia('(pointer: fine)').matches) {
          input.focus({ preventScroll: true });
        }
      }, function(){ busy = false; });
  }

  boot();
})();
</script>
